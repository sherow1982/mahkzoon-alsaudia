<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مخزون السعودية - الصفحة الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
body {font-family:'Cairo',sans-serif; margin:0; background:#f7fafc; color:#1a202c; min-height:100vh; display:flex; flex-direction:column;}
.header, .footer {background:#fff; box-shadow:0 4px 20px rgba(0,0,0,0.09);}
.header {padding:18px 0; position:sticky; top:0; z-index:55;}
.header-content {max-width:1200px; margin:auto; display:flex; justify-content:space-between; align-items:center;}
.logo {font-size:34px; font-weight:900; background:linear-gradient(135deg,#667eea,#764ba2); background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
nav {display:flex; gap:18px;}
nav a {color:#2d3748; text-decoration:none; font-weight:700;}
.cart-icon {font-size:24px; position:relative;}
.cart-count {position:absolute; top:-6px; right:-18px; background:#f5576c; color:#fff; border-radius:50%; padding:3px 10px; font-size:10px; font-weight:bold;}
.page-title {text-align:center; font-size:34px; margin:38px 0 22px;}
.search-bar {max-width:450px; margin:20px auto;}
.search-bar input {width:100%; padding:13px 16px; border-radius:7px; border:1.5px solid #e2e8f0; font-size:16px; box-sizing:border-box;}
.products-grid {display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px; max-width:1200px; margin:18px auto 38px;}
.product-card {background:#fff; border-radius:14px; box-shadow:0 5px 14px rgba(0,0,0,0.08); padding:26px 18px; transition:.27s; cursor:pointer;}
.product-card:hover {box-shadow:0 7px 24px rgba(102,126,234,0.11); transform:translateY(-4px);}
.product-title {font-size:18px; font-weight:700; color:#2d3748; margin-bottom:8px;}
.btn-view {background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; padding:9px 19px; border-radius:8px; font-weight:700; cursor:pointer; transition:.14s;}
.btn-view:hover {filter:brightness(1.08);}
.footer {margin-top:auto; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; text-align:center; padding:38px 18px 14px; border-radius:22px 22px 0 0;}
#scrollTop {position:fixed;bottom:34px;right:34px; background:#667eea; color:#fff; border:none; border-radius:50%; width:48px;height:48px; font-size:30px; font-weight:bold; cursor:pointer; display:none; box-shadow:0 7px 18px rgba(100,100,200,.11);}
#scrollTop.show {display:block;}
@media(max-width:700px){.header-content,.products-grid{padding:0 10px;}.products-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}.page-title{font-size:19px;}}
</style>
</head>
<body>
<header class="header">
  <div class="header-content">
    <a href="index.html" class="logo">مخزون السعودية</a>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="products.html">كل المنتجات</a>
      <a href="cart.html">السلة</a>
      <a href="account.html">حسابي</a>
      <a href="legal/privacy.html">الخصوصية</a>
    </nav>
    <div class="cart-icon" onclick="goToCart()">
      🛒 <span class="cart-count" id="cartCount">0</span>
    </div>
  </div>
</header>
<h1 class="page-title">جميع المنتجات</h1>
<div class="search-bar"><input id="searchInput" type="text" placeholder="ابحث عن منتج..."></div>
<div class="products-grid" id="productsGrid"></div>
<button id="scrollTop" title="عودة لأعلى">↑</button>
<footer class="footer">
  جميع الحقوق محفوظة © 2025 مخزون السعودية | سياسة الخصوصية | سياسة الاسترجاع | الشروط والاستخدام
</footer>
<script>
function goToCart() { window.location.href = "cart.html"; }
const productsUrl = "https://raw.githubusercontent.com/sherow1982/mahkzoon-alsaudia/main/data/products.json";
function makeProductFile(title) {
  if (!title) return '';
  return title.replace(/\s+/g,'-').replace(/[؟،؛!%$@#^&*()+={[}|\:;"'<>,.?\/]/g,'').trim() + '.html';
}
let allProducts = [];
function renderProducts(products){
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = products.map(p=>{
    const fileName = makeProductFile(p.title);
    return `
      <div class="product-card">
        <img src="${p.image_link}" alt="${p.title}" style="max-width:140px;max-height:140px;border-radius:8px;margin-bottom:10px;">
        <div style="font-weight:700;margin-bottom:7px">${p.title}</div>
        <div style="color:#764ba2;font-weight:bold">${p.sale_price} ر.س <del style="color:#aaa">${p.price} ر.س</del></div>
        <a href="/products/${fileName}" target="_blank" class="btn-view">شاهد المنتج</a>
      </div>
    `
  }).join('');
}
fetch(productsUrl).then(p=>p.json()).then(products=>{
  allProducts = products;
  renderProducts(products);
  document.getElementById('searchInput').oninput = function(){
    const val = this.value.trim();
    if(!val) renderProducts(allProducts);
    else renderProducts(allProducts.filter(f=>f.title.includes(val)));
  };
});
// زر العودة لأعلى
const scrollBtn = document.getElementById('scrollTop');
window.onscroll = function(){ 
  if (window.scrollY > 260) scrollBtn.classList.add('show'); 
  else scrollBtn.classList.remove('show');
};
scrollBtn.onclick = function(){ window.scrollTo({top:0,behavior:'smooth'}); };
</script>
</body>
</html>
