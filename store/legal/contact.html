<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - مخزون السعودية</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .legal-content {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            line-height: 1.8;
        }
        .legal-content h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .legal-content h2 {
            color: var(--secondary-color);
            margin: 25px 0 15px;
        }
        .legal-content ul, .legal-content ol {
            margin: 15px 0 15px 30px;
        }
        .legal-content li {
            margin-bottom: 10px;
        }
        .contact-info {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1><a href="../index.html">مخزون السعودية</a></h1>
                </div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="../index.html">الرئيسية</a></li>
                        <li><a href="../products.html">المنتجات</a></li>
                        <li><a href="../cart.html">السلة</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="legal-content">
        <h1>اتصل بنا</h1>
        
        <div class="contact-info">
            <p><strong>📍 العنوان:</strong> الرياض، المملكة العربية السعودية</p>
            <p><strong>📱 الجوال:</strong> <a href="tel:+966XXXXXXXXX">+966 XX XXX XXXX</a></p>
            <p><strong>📧 البريد:</strong> <a href="mailto:info@mahkzoon-sa.com">info@mahkzoon-sa.com</a></p>
            <p><strong>⏰ ساعات العمل:</strong> السبت - الخميس: 9 صباحاً - 6 مساءً</p>
        </div>
        
        <h2>راسلنا</h2>
        <form style="max-width: 600px; margin: 30px auto;">
            <div class="form-group">
                <label>الاسم</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" required>
            </div>
            <div class="form-group">
                <label>الموضوع</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>الرسالة</label>
                <textarea rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">إرسال</button>
        </form>
    
        
        <p style="margin-top: 40px; padding-top: 20px; border-top: 2px solid var(--border-color); color: #666;">
            آخر تحديث: نوفمبر 2025
        </p>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 مخزون السعودية. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>
</body>
</html>
