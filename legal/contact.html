<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>اتصل بنا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"><style>body{font-family:'Cairo',sans-serif;background:#f7fafc;color:#222;line-height:2;max-width:900px;margin:auto;padding:32px;direction:rtl;} h1{font-size:35px;color:#764ba2;} .contact-form{margin-top:25px;} label{font-weight:700;display:block;margin:17px 0 7px;} input,textarea{width:100%;padding:10px;border:1px solid #d1d5db;margin-bottom:12px;border-radius:10px;font-size:17px;} button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;padding:15px 36px;font-size:16px;font-weight:700;cursor:pointer;} .footer{margin-top:44px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:18px 12px 10px; border-radius:12px;} @media(max-width:750px){body{padding:17px;}}</style></head><body><h1>اتصل بنا</h1><form class="contact-form"><label>الاسم</label><input type="text" required><label>البريد الإلكتروني</label><input type="email" required><label>الرسالة</label><textarea required rows="6"></textarea><button type="submit">إرسال</button></form><div class="footer">&copy; 2025 مخزون السعودية</div></body></html>
